<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Belvia" />
<meta name="theme-color" content="#F2F2F4" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" />
<title>Belvia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root {
  --bg:#f2f2f4; --bar:#fff; --card:#fff; --ink:#1d1d1f;
  --muted:#6e6e73; --faint:#8e8e93; --line:rgba(0,0,0,.08); --fill:#f2f2f4;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{cursor:pointer;font:inherit;color:inherit}
#app{width:100%;max-width:430px;height:100dvh;height:100svh;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
header.top{grid-row:1;background:var(--bar);border-bottom:1px solid var(--line);padding:calc(10px + var(--safe-t)) 16px 10px;position:relative;z-index:5}
.barrow{display:flex;align-items:center;gap:10px;min-height:36px}
.mark{width:26px;height:26px;border-radius:7px;flex:0 0 auto;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:750;letter-spacing:-.04em}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:11px;color:var(--faint);font-weight:600}
.iconbtn{flex:0 0 auto;width:36px;height:36px;border:0;border-radius:18px;background:var(--fill);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
nav.pills{display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.pills::-webkit-scrollbar{display:none}
nav.pills button{flex:0 0 auto;height:32px;padding:0 12px;border:0;border-radius:999px;background:var(--fill);color:var(--muted);font-size:13px;font-weight:650}
nav.pills button.on{background:var(--ink);color:#fff}
.pager{grid-row:2;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.page{min-width:0;min-height:0;overflow-x:hidden;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding:16px 16px 24px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
nav.dock{grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);border-top:1px solid var(--line);padding:6px 2px calc(8px + var(--safe-b));position:relative;z-index:5}
nav.dock button{border:0;background:none;color:var(--faint);font-size:10px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
nav.dock button.on{color:var(--ink)}
nav.dock svg{width:22px;height:22px}
h2{margin:0 0 8px;font-size:26px;letter-spacing:-.035em;line-height:1.12}
h3{margin:0;font-size:16px;letter-spacing:-.02em}
.kicker{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted);font-size:14px;line-height:1.45}
.note{color:var(--muted);font-size:12px;line-height:1.4;margin-top:3px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.pad{padding:14px 16px}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:#fff;color:inherit;text-align:left;text-decoration:none}
.card>.row:first-of-type{border-top:0}
.when{width:4.8rem;flex-shrink:0}
.when b{display:block;font-variant-numeric:tabular-nums;font-size:15px}
.when span{font-size:11px;color:var(--faint);font-weight:600}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid #c7c7cc;flex-shrink:0;margin-top:2px;background:#fff}
.on .check{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 4px #fff}
.on .ttl{text-decoration:line-through;opacity:.45}
.ttl{margin:0;font-size:14px;font-weight:600}
.act{color:var(--ink);font-size:13px;font-weight:700;flex-shrink:0;padding:8px 0;text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;width:100%;border:0;border-radius:14px;font-size:16px;font-weight:650}
.btn-a{background:var(--ink);color:#fff}
.btn-g{background:var(--fill);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;padding:0 16px 12px}
.field label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.field input,.field textarea,.field select{border:0;background:var(--fill);border-radius:12px;padding:12px;font-size:16px;line-height:1.3;color:var(--ink);font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ticket{background:#fff;border-radius:18px;padding:16px;box-shadow:0 0 0 1px var(--line)}
.ticket .codes{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ticket .code{font-size:28px;font-weight:750;letter-spacing:-.04em}
.ticket .city{font-size:12px;color:var(--muted);margin-top:2px}
.ticket .mid{text-align:center;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ticket .meta{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.ticket .meta b{display:block;font-variant-numeric:tabular-nums}
.ticket .meta span{font-size:11px;color:var(--faint);font-weight:650}
.banner{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px var(--line);font-size:13px;color:var(--muted)}
#map{height:280px;border-radius:14px;background:#e8e8ed;touch-action:none}
.mapwrap{position:relative;padding:8px}
.mapclose{position:absolute;top:16px;left:16px;z-index:2;height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:min(430px,100%);background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--safe-b))}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="barrow">
      <div class="mark" aria-hidden="true">B</div>
      <div class="brand"><h1 id="hdrTitle">Belvia</h1><p id="hdrSub">On-device itinerary</p></div>
      <button class="iconbtn" data-act="export" type="button" aria-label="Export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 13v6h14v-6"/></svg>
      </button>
    </div>
    <nav class="pills" id="pills"></nav>
  </header>
  <div class="pager" id="pager">
    <section class="page" id="page-today"></section>
    <section class="page" id="page-plan"></section>
    <section class="page" id="page-map"></section>
    <section class="page" id="page-pack"></section>
    <section class="page" id="page-apps"></section>
  </div>
  <nav class="dock" id="dock"></nav>
</div>
<div class="overlay" id="export">
  <div class="sheet stack">
    <p class="kicker">Export</p>
    <h3>Add this trip to iPhone</h3>
    <p class="muted">Files stay on this device.</p>
    <button class="btn btn-a" type="button" data-act="ics-cal">Add to Calendar</button>
    <button class="btn btn-g" type="button" data-act="ics-rem">Add to Reminders</button>
    <button class="btn btn-g" type="button" data-act="export-close">Close</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="./app.js"></script>
<script src="./ui.js"></script>
<script src="./pages.js"></script>
<script src="./events.js"></script>
</body>
</html>
