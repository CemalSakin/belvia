<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Belvia" />
<meta name="theme-color" content="#1e3a5f" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" />
<title>Belvia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root {
  --navy:#1e3a5f; --khak:#f0e68c; --ink:#1e3a5f; --paper:#f0e68c;
  --bg:#1e3a5f; --bar:#f0e68c; --card:#f0e68c; --muted:#1e3a5f;
  --faint:#1e3a5f; --line:#1e3a5f; --fill:#e4d97a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;image-rendering:pixelated;border-radius:0 !important}
html,body{height:100%;margin:0;background:var(--navy);color:var(--khak);font-family:ui-monospace,Menlo,"SF Mono",monospace;overflow:hidden}
button{cursor:pointer;font:inherit;color:inherit}
#dither{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
#app{position:relative;z-index:1;width:100%;max-width:430px;height:100dvh;height:100svh;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header.top{grid-row:1;background:var(--khak);color:var(--navy);border-bottom:4px solid var(--navy);padding:calc(10px + var(--safe-t)) 12px 10px;position:relative;z-index:5}
.barrow{display:flex;align-items:center;gap:10px;min-height:36px}
.mark{width:26px;height:26px;flex:0 0 auto;background:var(--navy);color:var(--khak);display:grid;place-items:center;font-size:13px;font-weight:750}
.brand{flex:1;min-width:0;color:var(--navy)}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.brand p{margin:2px 0 0;font-size:10px;color:var(--navy);font-weight:600;opacity:.7}
.iconbtn{flex:0 0 auto;width:36px;height:36px;border:0;background:var(--navy);color:var(--khak);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
nav.pills{display:flex;gap:4px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.pills::-webkit-scrollbar{display:none}
nav.pills button{flex:0 0 auto;height:28px;padding:0 10px;border:2px solid var(--navy);background:transparent;color:var(--navy);font-size:11px;font-weight:700;text-transform:uppercase}
nav.pills button.on{background:var(--navy);color:var(--khak)}
.pager{grid-row:2;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.page{min-width:0;min-height:0;overflow-x:hidden;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding:16px 12px 24px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
nav.dock{grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);background:var(--khak);color:var(--navy);border-top:4px solid var(--navy);padding:6px 2px calc(8px + var(--safe-b));position:relative;z-index:5}
nav.dock button{border:0;background:none;color:var(--navy);opacity:.45;font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-transform:uppercase}
nav.dock button.on{opacity:1;background:var(--navy);color:var(--khak)}
nav.dock svg{width:18px;height:18px}
h2{margin:0 0 8px;font-size:22px;letter-spacing:.02em;line-height:1.2;text-transform:uppercase;color:var(--khak)}
h3{margin:0;font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.kicker{margin:0 0 6px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--khak)}
.muted{color:var(--khak);font-size:12px;line-height:1.45;opacity:.85}
.note{color:var(--navy);font-size:11px;line-height:1.4;margin-top:3px;opacity:.75}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--khak);color:var(--navy);box-shadow:4px 4px 0 #0b1a2e;overflow:hidden}
.pad{padding:14px 14px}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:0;border-top:2px solid var(--navy);background:var(--khak);color:inherit;text-align:left;text-decoration:none}
.card>.row:first-of-type{border-top:0}
.when{width:4.8rem;flex-shrink:0}
.when b{display:block;font-variant-numeric:tabular-nums;font-size:13px}
.when span{font-size:10px;font-weight:600}
.check{width:16px;height:16px;border:2px solid var(--navy);flex-shrink:0;margin-top:2px;background:transparent}
.on .check{background:var(--navy);box-shadow:inset 0 0 0 3px var(--khak)}
.on .ttl{text-decoration:line-through;opacity:.45}
.ttl{margin:0;font-size:13px;font-weight:700;text-transform:uppercase}
.act{color:var(--navy);font-size:12px;font-weight:700;flex-shrink:0;padding:8px 0;text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;border:0;font-size:13px;font-weight:700;text-transform:uppercase}
.btn-a{background:var(--khak);color:var(--navy);box-shadow:4px 4px 0 #0b1a2e}
.btn-g{background:transparent;color:var(--khak);border:2px solid var(--khak)}
.field{display:flex;flex-direction:column;gap:6px;padding:0 14px 12px}
.field label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.field input,.field textarea,.field select{border:2px solid var(--navy);background:var(--fill);padding:10px;font-size:14px;line-height:1.3;color:var(--navy);font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ticket{background:var(--khak);color:var(--navy);padding:14px;box-shadow:4px 4px 0 #0b1a2e}
.ticket .codes{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ticket .code{font-size:24px;font-weight:750}
.ticket .city{font-size:11px;margin-top:2px}
.ticket .mid{text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ticket .meta{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:2px dashed var(--navy)}
.ticket .meta b{display:block;font-variant-numeric:tabular-nums}
.ticket .meta span{font-size:10px;font-weight:650}
.banner{background:var(--khak);color:var(--navy);padding:12px 14px;box-shadow:4px 4px 0 #0b1a2e;font-size:12px}
#map{height:280px;background:#1e3a5f;touch-action:none;filter:grayscale(1) contrast(1.2) sepia(.4)}
.mapwrap{position:relative;padding:8px}
.mapclose{position:absolute;top:16px;left:16px;z-index:2;height:34px;padding:0 12px;border:0;background:var(--navy);color:var(--khak);font-size:12px;font-weight:700}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(30,58,95,.72);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:min(430px,100%);background:var(--khak);color:var(--navy);padding:16px 16px calc(18px + var(--safe-b));box-shadow:0 -6px 0 #0b1a2e}
</style>
</head>
<body>
<canvas id="dither" aria-hidden="true"></canvas>
<div id="app">
  <header class="top">
    <div class="barrow">
      <div class="mark" aria-hidden="true">B</div>
      <div class="brand"><h1 id="hdrTitle">Belvia</h1><p id="hdrSub">On-device itinerary</p></div>
      <button class="iconbtn" data-act="export" type="button" aria-label="Export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 13v6h14v-6"/></svg>
      </button>
    </div>
    <nav class="pills" id="pills"></nav>
  </header>
  <div class="pager" id="pager">
    <section class="page" id="page-today"></section>
    <section class="page" id="page-plan"></section>
    <section class="page" id="page-map"></section>
    <section class="page" id="page-pack"></section>
    <section class="page" id="page-apps"></section>
  </div>
  <nav class="dock" id="dock"></nav>
</div>
<div class="overlay" id="export">
  <div class="sheet stack">
    <p class="kicker">Export</p>
    <h3>Add this trip to iPhone</h3>
    <p class="muted">Files stay on this device.</p>
    <button class="btn btn-a" type="button" data-act="ics-cal">Add to Calendar</button>
    <button class="btn btn-g" type="button" data-act="ics-rem">Add to Reminders</button>
    <button class="btn btn-g" type="button" data-act="export-close">Close</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="./app.js"></script>
<script src="./ui.js"></script>
<script src="./pages.js"></script>
<script src="./events.js"></script>
<script>
(function(){
  const c=document.getElementById("dither"); if(!c) return;
  const N=[0x1e,0x3a,0x5f], K=[0xf0,0xe6,0x8c];
  const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  function paint(){
    const cell=5;
    const w=Math.ceil(innerWidth/cell), h=Math.ceil(innerHeight/cell);
    c.width=w; c.height=h; c.style.width=innerWidth+"px"; c.style.height=innerHeight+"px";
    const ctx=c.getContext("2d");
    const img=ctx.createImageData(w,h); const p=img.data;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const i=(y*w+x)*4;
        const n=Math.sin(x*0.17)+Math.cos(y*0.13)+((x*13+y*7)%11)/11;
        const t=0.45+(B[y&3][x&3]/16-0.5)*0.5;
        const col=(n*0.35+0.5)>t?K:N;
        p[i]=col[0]; p[i+1]=col[1]; p[i+2]=col[2]; p[i+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
  }
  paint(); addEventListener("resize", paint);
})();
</script>
</body>
</html>
