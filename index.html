<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="BudVia" />
<meta name="theme-color" content="#14301f" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" />
<title>BudVia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root {
  --navy:#1e3a5f;
  --wood:#3d2414; --wood-lit:#6b4224; --wood-ink:#1a0c06;
  --moss:#14301f; --moss-lit:#1d4630;
  --leaf:#c45a1a; --leaf-lit:#d9782e; --leaf-dim:#8a3d12;
  --plaque:#f3e2c0;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --grain:repeating-linear-gradient(90deg,#2b160c 0 2px,#5a341c 2px 5px,#3d2212 5px 8px,#6b4224 8px 10px,#2b160c 10px 13px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0 !important}
html,body{
  height:100%;height:100vh;height:100dvh;
  margin:0;background:var(--moss);color:var(--plaque);
  font-family:ui-monospace,Menlo,"SF Mono",Consolas,monospace;
  overflow:hidden;
}
button{cursor:pointer;font:inherit;color:inherit;background:none}
img,svg,.mark img,.brandshot{image-rendering:auto}
#app{
  position:relative;
  width:100%;max-width:430px;
  height:100%;height:100vh;height:100dvh;height:100svh;
  margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  overflow:hidden;
  background:var(--navy);
}
#dither{
  grid-column:1;grid-row:1 / -1;
  width:100%;height:100%;
  z-index:0;pointer-events:none;
  image-rendering:pixelated;
}
header.top, .pager, nav.dock{position:relative;z-index:2}
header.top{grid-column:1;grid-row:1;background:var(--moss);color:var(--plaque);border-bottom:5px solid var(--wood);padding:calc(8px + var(--safe-t)) 12px 8px}
.barrow{display:flex;align-items:center;gap:10px;min-height:36px}
.mark{width:36px;height:36px;flex:0 0 auto;background:var(--wood);overflow:hidden;border:2px solid var(--wood-lit)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand{flex:1;min-width:0;color:var(--plaque)}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.brand p{margin:3px 0 0;font-size:8px;line-height:1.3;font-weight:600;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.iconbtn{flex:0 0 auto;width:36px;height:36px;border:0;background:var(--wood);color:var(--plaque);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
nav.pills{display:flex;flex-wrap:nowrap;gap:4px;margin-top:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
nav.pills::-webkit-scrollbar{display:none}
nav.pills button{flex:0 0 auto;height:28px;padding:0 10px;border:2px solid var(--wood-lit);background:transparent;color:var(--plaque);font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap}
nav.pills button.on{background:var(--wood);color:var(--plaque)}
.pager{
  grid-column:1;grid-row:2;min-height:0;
  display:flex;flex-direction:row;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.pager::-webkit-scrollbar{display:none}
.page{
  flex:0 0 100%;
  width:100%;
  min-width:100%;
  height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  padding:16px 12px 28px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
nav.dock{grid-column:1;grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);background:var(--moss);color:var(--plaque);border-top:5px solid var(--wood);padding:6px 2px calc(8px + var(--safe-b))}
nav.dock button{border:0;background:none;color:var(--plaque);opacity:.45;font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-transform:uppercase;white-space:nowrap}
nav.dock button.on{opacity:1;background:var(--wood)}
nav.dock svg{width:18px;height:18px}
h2{
  position:relative;isolation:isolate;margin:0 0 12px;padding:14px 12px;
  font-size:20px;letter-spacing:.03em;line-height:1.25;text-transform:uppercase;color:var(--plaque);
  background:linear-gradient(180deg,var(--moss-lit),var(--moss));
  border:9px solid var(--wood);
  box-shadow:inset 0 0 0 2px var(--wood-lit),4px 4px 0 var(--wood-ink);
}
h2::before{content:"";position:absolute;inset:-9px;z-index:-1;pointer-events:none;background:var(--grain)}
h3{margin:0;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--plaque)}
.kicker{display:inline-block;margin:0 0 8px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--plaque);background:var(--moss);border:4px solid var(--wood);box-shadow:inset 0 0 0 1px var(--wood-lit),3px 3px 0 var(--wood-ink)}
.card .kicker,.ticket .kicker,.sheet .kicker{display:block;margin:0 0 6px;padding:0;color:var(--plaque);background:transparent;border:0;box-shadow:none;opacity:.8}
.muted{color:var(--plaque);font-size:12px;line-height:1.45;text-shadow:0 1px 0 #0b1a2e}
.note{color:var(--plaque);font-size:11px;line-height:1.4;margin-top:3px;opacity:.8}
.stack{display:flex;flex-direction:column;gap:10px}
.card,.ticket,.banner,.sheet{
  color:var(--plaque);
  background:linear-gradient(180deg,var(--moss-lit),var(--moss));
  border:5px solid var(--wood);
  box-shadow:inset 0 0 0 1px var(--wood-lit),3px 3px 0 var(--wood-ink);
  overflow:hidden;
}
.pad{padding:14px 14px}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:0;border-top:2px solid var(--wood);background:transparent;color:inherit;text-align:left;text-decoration:none}
.card>.row:first-of-type{border-top:0}
.when{width:4.8rem;flex-shrink:0}
.when b{display:block;font-variant-numeric:tabular-nums;font-size:13px}
.when span{font-size:10px;font-weight:600}
.check{width:16px;height:16px;border:2px solid var(--plaque);flex-shrink:0;margin-top:2px;background:transparent}
.on .check{background:var(--leaf-lit);box-shadow:inset 0 0 0 3px var(--moss)}
.on .ttl{text-decoration:line-through;opacity:.45}
.ttl{margin:0;font-size:13px;font-weight:700;text-transform:uppercase}
.act{color:var(--plaque);font-size:12px;font-weight:700;flex-shrink:0;padding:8px 0;text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;border:0;font-size:13px;font-weight:700;text-transform:uppercase}
.btn-a{background:var(--leaf-lit);color:var(--wood-ink);border:4px solid var(--wood);box-shadow:3px 3px 0 var(--wood-ink)}
.btn-g{background:var(--wood);color:var(--plaque);border:4px solid var(--wood-lit);box-shadow:3px 3px 0 var(--wood-ink)}
.field{display:flex;flex-direction:column;gap:6px;padding:0 14px 12px}
.field label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--plaque)}
.field input,.field textarea,.field select{
  border:2px solid var(--wood);background:#0c1c14;padding:10px;
  font-size:16px;line-height:1.3;color:var(--plaque);font-family:inherit;
  width:100%;min-width:0;
  -webkit-appearance:none;appearance:none;
  color-scheme:dark;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ticket{padding:14px}
.ticket .codes{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ticket .code{font-size:24px;font-weight:750}
.ticket .city{font-size:11px;margin-top:2px}
.ticket .mid{text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ticket .meta{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:2px dashed var(--wood)}
.ticket .meta b{display:block;font-variant-numeric:tabular-nums}
.ticket .meta span{font-size:10px;font-weight:650}
.banner{padding:12px 14px;font-size:12px}
.brandshot{width:100%;max-height:360px;object-fit:contain;object-position:top;margin:10px 0;border:5px solid var(--wood);display:block;background:#0c1c14}
#map{height:220px;background:#1e3a5f;touch-action:none;filter:grayscale(1) contrast(1.15) sepia(.55)}
.mapwrap{position:relative;padding:8px}
.mapclose{position:absolute;top:16px;left:16px;z-index:2;height:34px;padding:0 12px;border:0;background:var(--wood);color:var(--plaque);font-size:12px;font-weight:700}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,48,31,.72);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:min(430px,100%);padding:16px 16px calc(18px + var(--safe-b))}
</style>
</head>
<body>
<div id="app">
  <canvas id="dither" aria-hidden="true"></canvas>
  <header class="top">
    <div class="barrow">
      <div class="mark" aria-hidden="true">B</div>
      <div class="brand"><h1 id="hdrTitle">BudVia</h1><p id="hdrSub">Not all who wander are lost, especially with the right companion: Tolkien</p></div>
      <button class="iconbtn" data-act="export" type="button" aria-label="Export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 13v6h14v-6"/></svg>
      </button>
    </div>
    <nav class="pills" id="pills"></nav>
  </header>
  <div class="pager" id="pager">
    <section class="page" id="page-today"></section>
    <section class="page" id="page-plan"></section>
    <section class="page" id="page-map"></section>
    <section class="page" id="page-pack"></section>
    <section class="page" id="page-apps"></section>
  </div>
  <nav class="dock" id="dock"></nav>
</div>
<div class="overlay" id="export">
  <div class="sheet stack">
    <p class="kicker">Export</p>
    <h3>Add this trip to iPhone</h3>
    <p class="muted">Files stay on this device.</p>
    <button class="btn btn-a" type="button" data-act="ics-cal">Add to Calendar</button>
    <button class="btn btn-g" type="button" data-act="ics-rem">Add to Reminders</button>
    <button class="btn btn-g" type="button" data-act="export-close">Close</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="./icon.js"></script>
<script src="./example.js"></script>
<script src="./app.js"></script>
<script src="./ui.js"></script>
<script src="./pages.js"></script>
<script src="./events.js"></script>
<script>
(function(){
  const c=document.getElementById("dither"); if(!c) return;
  const N=[0x1e,0x3a,0x5f], K=[0x2a,0x4e,0x3a];
  const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  function paint(){
    const box=document.getElementById("app")||document.body;
    const cell=6;
    const W=box.clientWidth||innerWidth, H=box.clientHeight||innerHeight;
    const w=Math.max(1,Math.ceil(W/cell)), h=Math.max(1,Math.ceil(H/cell));
    c.width=w; c.height=h;
    const ctx=c.getContext("2d");
    const img=ctx.createImageData(w,h); const p=img.data;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const i=(y*w+x)*4;
        const n=((x*13+y*7)%17)/17;
        const t=0.78+(B[y&3][x&3]/16-0.5)*0.12;
        const col=n>t?K:N;
        p[i]=col[0]; p[i+1]=col[1]; p[i+2]=col[2]; p[i+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
  }
  paint(); addEventListener("resize", paint);
})();
</script>
</body>
</html>
